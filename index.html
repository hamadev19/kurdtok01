
<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KurdTok</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090909;color:white;
 font-family:Arial,sans-serif;
 display:flex;justify-content:center;
 align-items:center;min-height:100vh;
}
.card{
 width:90%;max-width:390px;
 background:#181818;padding:30px;
 border-radius:22px;text-align:center;
}
.logo{font-size:48px;font-weight:bold;color:#ff3155}
h1{font-size:32px;margin:8px}
p{color:#aaa}
button,input{
 width:100%;padding:14px;margin-top:13px;
 border-radius:12px;font-size:16px;
}
button{border:0;cursor:pointer;font-weight:bold}
.google{background:white;color:#222}
.facebook{background:#1877f2;color:white}
.guest{background:#ff3155;color:white}
input{background:#292929;color:white;border:1px solid #444}
#message{color:#22c55e}
</style>
</head>
<body>
<div class="card">
 <div class="logo">K</div>
 <h1>KurdTok</h1>
 <p>بەخێربێیت بۆ جیهانی ڤیدیۆی کوردی ❤️</p>

 <button class="google" onclick="login('Google')">
  بەردەوام بە لەگەڵ Google
 </button>

 <button class="facebook" onclick="login('Facebook')">
  بەردەوام بە لەگەڵ Facebook
 </button>

 <button class="guest" onclick="showGuest()">
  چوونەژوورەوە وەک میوان
 </button>

 <div id="guestBox" hidden>
  <input id="username" placeholder="ناوی خۆت بنووسە">
  <button class="guest" onclick="createAccount()">
   دروستکردنی ئەکاونت
  </button>
 </div>

 <p id="message"></p>
</div>

<script>
function showGuest(){
 document.getElementById('guestBox').hidden=false;
}
function createAccount(){
 const name=document.getElementById('username').value.trim();
 if(!name){
  alert('تکایە ناوی خۆت بنووسە');
  return;
 }
 localStorage.setItem('kurdTokName',name);
 document.getElementById('message').innerText=
 'بەخێربێیت '+name+' ❤️';
}
function login(provider){
 alert('بۆ چوونەژوورەوەی ڕاستەقینەی '+
 provider+' پێویستە API پەیوەست بکرێت.');
}
</script>
</body>
</html>
